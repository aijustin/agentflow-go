name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  studio:
    name: Studio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/studio/pnpm-lock.yaml

      - name: Test Studio
        run: cd web/studio && pnpm install --frozen-lockfile && pnpm test

      - name: Build embedded Studio
        run: make studio-ui

      - name: Verify committed Studio bundle
        run: git diff --exit-code internal/adapter/observability/http/uistatic

  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.x", "stable"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Unit tests with race detector
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Coverage gate
        run: MIN_COVERAGE=60 scripts/check-coverage.sh

      - name: Integration tests
        run: go test -tags=integration -count=1 ./...

      - name: Build binaries
        run: make build
